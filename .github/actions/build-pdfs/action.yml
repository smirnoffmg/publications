name: Build PDFs
description: Install TeX Live and compile LaTeX sources via make

inputs:
  tex_list:
    description: >
      Root-level .tex files to build, one per line. Leave empty to compile all
      root-level .tex files.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install TeX Live
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          latexmk \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-lang-cyrillic \
          texlive-bibtex-extra \
          texlive-science
    - name: Compile LaTeX sources
      shell: bash
      run: |
        if [ -z "${{ inputs.tex_list }}" ]; then
          make
        else
          tex_list_file="${RUNNER_TEMP}/tex-files.txt"
          printf '%s\n' "${{ inputs.tex_list }}" > "${tex_list_file}"
          make TEX_LIST="${tex_list_file}" build-list
        fi
